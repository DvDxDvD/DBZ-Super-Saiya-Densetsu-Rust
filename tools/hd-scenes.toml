# The scenes of the HD remaster that `cargo xtask hd-art scenes` finds and that are accepted as they
# are (README, "hd-art scenes"). A scene is covered by an exception when every field the exception
# gives matches: `part` and `item` are substrings (of the part's name and of a thing the scene lists),
# `reason` one of the scene's reasons, `modes` the game mode (`$24` of work RAM without bit 7) it is
# in, `map` the map id. The `note` says why. The command exits 1 while a scene is covered by none.

# Not story or field scenes: the battle, its animations, the last fight and the endings. Their
# fighters, effects and backgrounds are the battle audits' (hd-tour: fighters, effects, battle_bg).
[[exception]]
modes = [2, 4, 8, 12, 17]
note = "battle command screen, battle animations, last fight and endings: audited by the battle classes of hd-tour"

# The opening and the title: the plane of the Mode 7 flights is one flat blue there, nothing to redraw.
[[exception]]
reason = "map"
item = "map:unnamed"
modes = [7]
note = "the opening and the title: a Mode 7 plane that is one flat colour"

# The party's fade-in at the start of a map: the sprites show as stripes for two frames.
[[exception]]
item = "pose:effect:partial"
note = "a sprite fading in as stripes (two frames at a map's start)"

# Sprites that start in the lowest lines (the overscan of the 239-line frame, below the 224 lines the
# game draws its picture in) are in no group of the capture: what shows of them is the look.
[[exception]]
item = "(overscan)"
note = "objects entering from below the 224 lines of the game's picture: no group holds them"

